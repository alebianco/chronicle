# Hilt's test application, so `@HiltAndroidTest` can build a graph under Robolectric (cu-185).
#
# Without this the scenario suites launch the *real* `ChronicleApplication`, which is
# `@HiltAndroidApp` and does its whole startup — network setup, WorkManager, legacy-row adoption —
# before a single line of the screen under test runs.
application = dagger.hilt.android.testing.HiltTestApplication

# **Pinned, and it has to be.** Robolectric otherwise takes `targetSdk`, which is 36 — and SDK 36
# requires Java 21 while this build targets 17, so every Robolectric suite fails at sandbox
# creation with "Android SDK 36 requires Java 21 (have Java 17)". That is not new to Hilt: adding
# this file is simply the first time Robolectric had a config to read, so it had been defaulting
# lower. 35 is the highest level Java 17 can host.
#
# Raise this with the toolchain, not with `compileSdk`.
sdk = 35

