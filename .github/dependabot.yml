# Dependabot — "what is newer", the counterpart to the dependency-analysis
# plugin's "what is unused" (cu-212).
#
# Why this exists: Room's KMP support landed in 2.8.3 while this project sat on
# 2.8.1, and that was found by reading release notes by hand. This is the free
# version of that work.
#
# target-branch is deliberate. decision-23 puts all task work on
# `feature/agentic-dev` until a release is cut, because `develop` has neither
# the backlog nor verify.sh. Dependabot would otherwise default to the
# repository default branch (`develop`) and open PRs CI does not test — so
# ci.yml carries `feature/agentic-dev` in its triggers, and every PR here gets
# the full eight-stage gate.
#
# The `ignore` blocks are pins this project holds on purpose. Each names its
# reason and the condition that removes it. Without them a weekly PR against
# each pin trains everyone to ignore the bot, which is worse than no bot.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    target-branch: feature/agentic-dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      # Scoped Commits (constitution): "<scope>: <description>". The scope is
      # the subsystem, and a dependency bump's subsystem is the build.
      prefix: "build"
    groups:
      # Related updates travel together: a Kotlin bump without its KSP twin is
      # a broken build, and an AndroidX family split across five PRs is five
      # times the review for one decision.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      coroutines:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines-*"
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-lifecycle:
        patterns:
          - "androidx.lifecycle:*"
      androidx-navigation:
        patterns:
          - "androidx.navigation:*"
      androidx-room:
        patterns:
          - "androidx.room:*"
      androidx-media3:
        patterns:
          - "androidx.media3:*"
      androidx-test:
        patterns:
          - "androidx.test*"
      dagger-hilt:
        patterns:
          - "com.google.dagger:*"
          - "androidx.hilt:*"
      ktor:
        patterns:
          - "io.ktor:*"
          - "de.jensklingenberg.ktorfit*"
      androidx-other:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
          - "androidx.lifecycle:*"
          - "androidx.navigation:*"
          - "androidx.room:*"
          - "androidx.media3:*"
          - "androidx.test*"
          - "androidx.hilt:*"
    ignore:
      # Kotlin + KSP: KSP releases are built against one exact Kotlin version.
      # There is no KSP release for Kotlin 2.4, so a Kotlin 2.4 PR cannot
      # build. Unblock when: KSP ships a release for Kotlin 2.4 (cu-214).
      #
      # No update-types filter: a Kotlin *patch* still moves kotlin-stdlib, and
      # the ceiling is KSP's support matrix rather than a semver level. Letting
      # patches through would reopen exactly the failure this pin exists for.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
      - dependency-name: "com.google.devtools.ksp*"

      # Compose BOM beyond the 2026.06.x line pulls Compose 1.12.0, which requires
      # **AGP 9.1.0** — not compileSdk 37, which decision-22 recorded and which this
      # project now has. Measured: `checkDebugAarMetadata` fails with "Dependency
      # 'androidx.compose.material:material-ripple-android:1.12.0' requires Android
      # Gradle plugin 9.1.0 or higher" on AGP 8.13.2 with compileSdk 37.
      # Unblock when: AGP 9 becomes viable (cu-214 records what blocks it).
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.07.00"]

      # lifecycle 2.11.0 requires **AGP 9.1.0**; 2.10.x does not. Measured the same
      # way as the Compose BOM above — compileSdk 37 alone is not enough.
      # The bound is >=2.11.0 rather than >2.10.0 so a 2.10.x patch fix is not
      # held back for a constraint that does not apply to it.
      # Unblock when: AGP 9 becomes viable (cu-214).
      - dependency-name: "androidx.lifecycle:*"
        versions: [">=2.11.0"]

      # Room 3.0 is a breaking major, still alpha, and nothing consumes it.
      # Unblock when: cu-182 names a multiplatform target that needs it.
      - dependency-name: "androidx.room:*"
        versions: [">=3.0.0"]

      # The hamcrest pair is deliberately unbalanced: hamcrest-all is held at 1.3
      # and hamcrest at 2.2, because moving either one alone puts
      # org.hamcrest.Matchers in neither merged jar and every instrumented test
      # fails at runtime with NoClassDefFoundError (cu-54).
      #
      # The wildcard is the point: naming only hamcrest-all would leave the 2.2
      # half free to move, which breaks the balance just as effectively.
      # Unblock when: probably never. Both must move together, by hand.
      - dependency-name: "org.hamcrest:*"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: feature/agentic-dev
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "build"
    groups:
      actions:
        patterns:
          - "*"
