# Thin wrapper around ./verify.sh — the gate of record (decision-12 rule 6).
#
# Deliberately minimal and free of GitHub-specific logic beyond checkout,
# JDK setup, caching and artifact upload, so this project can move to another
# forge (GitLab CI, Woodpecker, Forgejo) by rewriting ~30 lines and calling the
# same script. Do not encode build rules here — put them in verify.sh or Gradle.
name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permissions
        run: chmod +x gradlew verify.sh coverage-ratchet.sh

      - name: Run verify.sh
        run: ./verify.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: warn

      - name: Report coverage in job summary
        if: always()
        run: |
          if [ -f coverage-baseline.txt ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Instruction coverage baseline: **$(cat coverage-baseline.txt)%**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Full HTML report is in the \`coverage-report\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
