# Thin wrapper around ./verify.sh — the gate of record (decision-12 rule 6).
#
# Deliberately minimal and free of GitHub-specific logic beyond checkout,
# JDK setup, caching and artifact upload, so this project can move to another
# forge (GitLab CI, Woodpecker, Forgejo) by rewriting ~30 lines and calling the
# same script. Do not encode build rules here — put them in verify.sh or Gradle.
name: CI

on:
  push:
    # feature/agentic-dev is where all task work lands until a release is cut
    # (decision-23), and it is Dependabot's target-branch — without it here,
    # every bot PR would open against a branch CI does not test.
    branches: [ main, master, develop, feature/agentic-dev ]
  pull_request:
    branches: [ main, master, develop, feature/agentic-dev ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permissions
        run: chmod +x gradlew verify.sh coverage-ratchet.sh

      - name: Run verify.sh
        run: ./verify.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: warn

      - name: Report coverage in job summary
        if: always()
        run: |
          if [ -f coverage-baseline.txt ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Instruction coverage baseline: **$(cat coverage-baseline.txt)%**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Full HTML report is in the \`coverage-report\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The instrumented suite, on its own job rather than appended to `verify`.
  #
  # It exists because a 100% launch crash once shipped with 1,678 unit tests green: the Ktorfit
  # base URL lacked a trailing slash, the clients are @Singleton so Hilt built them inside
  # Application.onCreate, and no window was ever created. `LoggedInLaunchTest` would have caught it
  # on the day it was written — nothing ever ran it. An unwired gate is not a gate.
  #
  # Separate from `verify` so the fast gate still reports in ~2 minutes instead of queueing behind
  # two emulator boots, and so a red tick names which half broke. Both run on every PR.
  instrumented:
    name: Instrumented (API 27 + 35)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # No cache for the emulator system images. Revisit this only with the note below in mind.
      #
      # Caching them looked free — they live outside ~/.gradle, so each run refetched ~1.7 GB. But a
      # restored system-images directory made `api35Setup` fail with "Cannot query the value of this
      # property because it has no value available", and the run that first restored the cache is
      # exactly the run that broke.
      #
      # That was originally read as "AGP resolves something at install time that unpacking a cached
      # directory does not reconstruct". That reading was **wrong**. It is the same unguarded
      # `getEmulatorDirectoryProvider().get()` described in the pre-install step below: with the
      # images already cached, api35 became the *first* device to reach that call, before the
      # emulator package had been installed. The cache did not corrupt anything — it changed the
      # ordering.
      #
      # So caching may well be safe now that the emulator is installed up front. It is left off
      # because that is unmeasured, and a ~40 s download is not worth risking the gate on a guess.
      #
      # Do not "revisit under AGP 9" for `testedAbi` — this project is on AGP 9.4.0 and it is still
      # absent from the public DSL, so that escape hatch was never there.

      # Gradle Managed Devices boot a real emulator, which needs KVM. The ubuntu-latest image
      # ships /dev/kvm but leaves it root-owned, so without this the devices fail to start —
      # and the failure mode that matters is a run that reports green having tested nothing.
      - name: Enable KVM
        run: |
          # The udev route is the documented one, but `udevadm control --reload-rules` exits
          # non-zero on a GitHub runner and `bash -e` then kills the step before the emulator is
          # ever reached. So the rule is best-effort and the *outcome* is what gets asserted.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          # Fallback: chmod directly. One of the two works, and which one is not interesting.
          sudo chmod 666 /dev/kvm || true
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable — the emulator cannot start on this runner."
            ls -l /dev/kvm || echo "/dev/kvm does not exist"
            exit 1
          fi
          echo "/dev/kvm is writable"

      - name: Grant execute permissions
        run: chmod +x gradlew verify.sh coverage-ratchet.sh

      # Install the emulator package BEFORE Gradle runs. This is what lets api27 exist in
      # `ciCheckGroup` at all, and it is a workaround for an AGP bug, not a preference.
      #
      # `ManagedDeviceInstrumentationTestSetupTask$ManagedDeviceSetupRunnable` guards the *system
      # image* it resolves (`sdkImageDirectoryProvider(...).isPresent`, with a written-out error
      # message for the missing case) and then calls `getEmulatorDirectoryProvider().get()` with
      # **no `isPresent` check** — verified by reading the bytecode of AGP 9.4.0. When the emulator
      # package is not installed yet, that provider has no value and Gradle throws its generic
      # "Cannot query the value of this property because it has no value available", naming no
      # property, which is why the message never mentioned the emulator.
      #
      # The runner's timestamps show the race plainly: api27Setup began installing the emulator at
      # 11:57:17, failed at 11:57:18, and the emulator package only finished at 11:57:23 — five
      # seconds after the task that needed it had already died. api35 then succeeded on the same
      # runner *because* it ran second, by which point the package was there.
      #
      # It has never reproduced locally for the same reason: a dev machine already has the package.
      # This also explains the api35Setup failure that the image cache once caused — the cache
      # changed install ordering, making api35 the first device to hit the same unguarded call.
      - name: Install the emulator package
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator
          # Assert the outcome, not the exit code: the whole point is that a missing directory
          # surfaces later as an unrelated-looking Gradle error inside a setup task.
          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            echo "::error::$ANDROID_HOME/emulator/emulator is missing — api27Setup will fail with 'no value available'."
            ls -l "$ANDROID_HOME/emulator" || echo "no emulator directory at all"
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -version | head -2

      # --instrumented is opt-in locally (it costs minutes and two emulator boots, which would
      # wreck the inner loop) but never optional here.
      - name: Run the instrumented suite
        run: ./gradlew ciCheckGroupGroupDebugAndroidTest

      # Proof the suite ran, not merely that the job was green. A managed-device task that boots
      # nothing still exits 0, which is indistinguishable from success until you read the results.
      - name: Confirm tests actually executed
        if: always()
        run: |
          results=$(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null | wc -l)
          if [ "$results" -eq 0 ]; then
            echo "::error::No instrumented test results were produced — the emulators did not run."
            exit 1
          fi
          echo "found $results result file(s)"
          grep -ho 'tests="[0-9]*"' $(find app/build/outputs/androidTest-results -name '*.xml') \
            | head -20

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn
