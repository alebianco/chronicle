# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Raised from 1236m: Hilt's generated component tree pushed `mergeExtDexDebug` into
# `OutOfMemoryError: Java heap space`, and the daemon then died with the GC thrashing. 3g is what
# the dex merge needs with the generated classes present.
org.gradle.jvmargs=-Xmx3g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enable kotlin annotations to be processed incrementally
#kapt.incremental.apt=true
#kapt.include.compile.classpath=false
#android.lifecycleProcessor.incremental=true
#android.nonTransitiveRClass=false
#android.nonFinalResIds=false
# AGP 9 compatibility mode, kept deliberately rather than as a leftover.
#
# `newDsl=false` restores the pre-9 variant API — `applicationVariants` — which the pitest plugin
# is built on. Its latest release (0.2.27, March 2026) has no AGP 9 support and none in flight, so
# without this, mutation testing cannot run at all: the plugin fails at *configuration* time and
# `verify.sh --mutation` loses its stage entirely.
#
# `builtInKotlin=false` keeps the separate `org.jetbrains.kotlin.android` plugin applied rather
# than AGP 9's built-in Kotlin. Required alongside the above; without it the unit-test
# configurations the pitest plugin reads (`<variant>UnitTestRuntimeClasspath`) are not created.
#
# **This is a deferral, not a fix.** AGP warns that the legacy variant API is removed in AGP 10, so
# this buys time for the plugin to catch up rather than solving it. Revisit when either the pitest
# plugin ships AGP 9 support or AGP 10 forces the issue — whichever comes first.
android.newDsl=false
android.builtInKotlin=false

# Build cache: reuse task outputs across builds and across CI runs. The CI job already caches
# ~/.gradle/caches, which without this carries dependency jars but no task outputs — so a run paid
# ~43 s to restore a cache that could not skip any work ("42 actionable tasks: 42 executed").
org.gradle.caching=true

# Configuration cache: verify.sh invokes Gradle eight times, so the configuration phase is paid
# eight times per run — Gradle prints "Consider enabling configuration cache" on every one of them.
# Warm locally this took an up-to-date build from ~35 s to 676 ms.
#
# On CI this helps *within* a run (invocations 2-8) but not across runs: the entry is not portable
# unless it is encrypted with a key, which only `gradle/actions/setup-gradle` can supply — and that
# tier is beta and gated behind a Develocity trial (`trial-not-licensed` in its type declarations).
# So the cross-run win is deliberately not claimed here.
org.gradle.configuration-cache=true
