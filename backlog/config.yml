project_name: "Chronicle Unabridged"
default_status: "To Do"
statuses: ["To Do", "In Progress", "In Review", "Done"]
labels: []
definition_of_done: ["Verify loop green (./gradlew ktlintFormat ktlintCheck testDebugUnitTest assembleDebug lintDebug)", "Tests added/extended for touched repos/ViewModels/sync/download logic", "Self-review pass done (CLAUDE.md definition of done)", "Docs synced in same change (task file / backlog/docs/reference / CLAUDE.md)"]
date_format: yyyy-mm-dd
max_column_width: 24
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 0
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "cu"
