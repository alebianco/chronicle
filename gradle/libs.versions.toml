[versions]
agp = "9.4.0"
# Compose is pinned by a BOM (composeBom); the compiler ships with Kotlin 2.x itself
# (org.jetbrains.kotlin.plugin.compose), so there is no separate compiler version to keep in step.
#
# 2026.08.00 pulls Compose 1.12.0, whose `material-ripple-android` and ten sibling artifacts each
# require AGP 9.1.0. That hold is lifted: this project is on AGP 9.4.0. Note it was never
# compileSdk -- 37 landed under AGP 8 and lifted nothing.
composeBom = "2026.08.00"
kotlin = "2.3.21"
coroutines = "1.11.0"
material = "1.14.0"
room = "2.8.4"
ksp = "2.3.11"
coil = "3.6.2"
timber = "5.0.1"
dagger = "2.60.1"
media3 = "1.11.0"
media = "1.7.0"
kotlinReflect = "2.2.10"
work = "2.11.2"
result = "2.0.1"
swiperefresh = "1.1.0"
seismic = "1.0.3"
okhttp3 = "5.5.0"
ktor = "3.5.2"
# The version Ktor 3.2.1 resolves to on its own. Kept in step with `ktor` deliberately: the
# converter and the runtime are one boundary, and a newer serializer under an older Ktor is the
# kind of mismatch that shows up as a parse failure rather than a build error.
datastore = "1.2.1"
okio = "3.18.2"
serialization = "1.11.0"
ktorfit = "2.7.5"
browserx = "1.8.0"
aboutlibraries = "15.2.0"
dependencyAnalysis = "3.19.1"
appcompat = "1.8.0"
# Declared at the version they already resolve to, so this pins today's behaviour rather
# than changing it. They arrive transitively from appcompat/material/room; three transitive-only
# breakages — `androidx.lifecycle`, then `androidx.localbroadcastmanager` and `androidx.media` —
# are why the app now names what it imports.
# Raised from 1.8.2 with Compose: activity-compose 1.13.0 upgrades `activity` anyway, and
# leaving the catalog behind would state a version the build does not use. In 1.10+ `onNewIntent`
# takes a non-null Intent -- a real signature change, fixed at the override in MainActivity.
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
androidx-recyclerview = "1.3.0"
androidx-fragment = "1.9.0"
androidx-transition = "1.6.0"
androidx-sqlite = "2.7.0"
lifecycle = "2.11.0"
annotation = "1.10.0"
ktlint = "12.1.2"
# Held on the 1.23.x line deliberately. detekt 2.x is a rewrite: rule ids move, the config schema
# changes and the baseline format is not compatible, so adopting it is its own task rather than a
# version bump. 1.23.8 is the last release of the 1.23 line.
#
# 1.23.x embeds a Kotlin 1.9 parser. That reads the sources here without complaint because nothing
# in the tree uses post-1.9 syntax; `DetektRuleSetTest` is what notices if the config drifts, and a
# parse failure would surface as a detekt error rather than a finding.
detekt = "1.23.8"
pitest = "0.2.27"
pitestTool = "1.30.0"
junit = "4.13.2"
# Test-only, and deliberately narrow in scope: Turbine is for assertions about a *stream* of
# events. `util/FlowTestExt.kt` keeps the `StateFlow`-conflation helpers, which answer a different
# question ("what did this settle on") that Turbine has no better answer for.
turbine = "1.2.1"
# 0.x: the least settled dependency here, its API has moved between minors.
circuit = "0.38.0"
mockk = "1.14.11"
robolectric = "4.16.1"
hamcrest = "1.3"
hamcrestModern = "2.2"
coreTesting = "2.2.0"
espresso = "3.5.1"
androidxTest = "1.5.0"
androidxTestExt = "1.1.5"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
# Same Coil 3 the app already uses, so a Compose screen loads cover art through the *same*
# ImageLoader (and therefore the same OkHttp client, cache and Plex auth) as every XML screen.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "dagger" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version = "1.3.0" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version = "1.3.0" }
# `hiltViewModel()` for Compose. **Not** `hilt-navigation-compose`, which is where it used to live:
# that artifact deprecated it in favour of this package, and its *navigation* half has had no callers
# since Circuit took over routing (decision-27).
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version = "1.3.0" }
# Buildscript-only: pins JavaPoet above the 1.10.0 AGP puts on the same classpath, which Hilt's
# Gradle plugin cannot run against. See the note in the root build.gradle.kts.
javapoet = { group = "com.squareup", name = "javapoet", version = "1.13.0" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "dagger" }
media = { group = "androidx.media", name = "media", version.ref = "media" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlinReflect" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
# Declared rather than inherited, because `CastButton` imports `MediaRouteButton`
# directly — the Compose toolbar hosts the real View, since the Cast SDK has no Compose surface
#. Pinned at the version media3-cast already resolved to, so this changes nothing today.
mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version = "1.8.1" }
# Lets Fetch2 download through the app's own OkHttp client, so downloads inherit the
# Plex interceptor, the 401 re-auth and the tiered connection chooser.
work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
result = { group = "com.michael-bull.kotlin-result", name = "kotlin-result", version.ref = "result" }
swiperefresh = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefresh" }
seismic = { group = "com.squareup", name = "seismic", version.ref = "seismic" }
okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp3" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# Ktor's own kotlinx-serialization converter, replacing the hand-written `MoshiContentConverter`
# (decision-24 deferred the serializer deliberately; this is the change that finishes it).
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorfit-lib = { group = "de.jensklingenberg.ktorfit", name = "ktorfit-lib", version.ref = "ktorfit" }
ktorfit-ksp = { group = "de.jensklingenberg.ktorfit", name = "ktorfit-ksp", version.ref = "ktorfit" }
okhttp3-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp3" }
# mockwebserver3, not the legacy `mockwebserver` artifact: the old package still ships at 5.4.0 but
# only as a compatibility shim (its jar contains a literal `DeprecationBridgeKt`), so depending on
# it is depending on something whose name says it is transitional.
okhttp3-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp3" }
browserx = { group = "androidx.browser", name = "browser", version.ref = "browserx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
# Fragment lifecycle testing. `debugImplementation`, not `testImplementation`: it ships an
# empty host activity that must be in the debug manifest for Robolectric to launch a fragment into.
androidx-fragment-testing = { group = "androidx.fragment", name = "fragment-testing", version.ref = "androidx-fragment" }
androidx-transition = { group = "androidx.transition", name = "transition", version.ref = "androidx-transition" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidx-sqlite" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Declared at the version Ktor 3.2.1 already resolves to, so this pins today's behaviour rather
# than changing it — the same rule the androidx entries above follow. It is the *serializer* now,
# not just a transitive of the transport, so it is named explicitly.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Okio: already on the runtime classpath transitively via Coil and Ktor, so declaring it adds no
# APK weight — it makes an existing dependency explicit. `okio-fakefilesystem` is test-only and is
# the thing actually being bought: an in-memory filesystem for the download and cache paths.
# DataStore replaces SharedPreferences as the settings store. The synchronous PrefsRepo surface is
# kept: 113 call sites read it directly, 21 of them from the player while configuring ExoPlayer,
# where there is no suspend context and blocking on I/O would be worse than what it replaces.
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
okio-fakefilesystem = { group = "com.squareup.okio", name = "okio-fakefilesystem", version.ref = "okio" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
circuit-foundation = { group = "com.slack.circuit", name = "circuit-foundation", version.ref = "circuit" }
circuit-test = { group = "com.slack.circuit", name = "circuit-test", version.ref = "circuit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
hamcrest = { group = "org.hamcrest", name = "hamcrest-all", version.ref = "hamcrest" }
hamcrest-modern = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrestModern" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "coreTesting" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-ext-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExt" }

# --- Compose ---------------------------------------------------------------------
# Everything Compose comes from the BOM so the artifacts cannot drift apart from each other.
# Declared without a version on purpose: `platform(composeBom)` supplies it.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
# collectAsStateWithLifecycle — the lifecycle-aware collector; a bare collectAsState keeps
# collecting while backgrounded, which is the Compose form of the bug CLAUDE.md bans
# `lifecycleScope.launch` for.
compose-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
# detekt owns complexity, potential bugs and coroutine misuse. It does **not** own formatting,
# naming or style: ktlint owns those, and running both on the same concerns produces contradictory
# advice. `config/detekt/detekt.yml` disables those rule sets explicitly.
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# droidsonroids fork, not mainline solidsoft: solidsoft is built on JavaPlugin and needs
# sourceSets.main/test, which com.android.application does not provide.
pitest = { id = "pl.droidsonroids.pitest", version.ref = "pitest" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Ships with Kotlin itself, so it reuses the `kotlin` ref rather than carrying a version that
# could drift out of step with the compiler it plugs into.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Generates the third-party dependency metadata from the resolved graph at build time.
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
# Reports unused declared dependencies and used-but-undeclared ones. Advisory: `buildHealth` is run
# on demand and read by a human, not wired into verify.sh -- its advice needs judgement (see the
# hamcrest-modern case in cu-54, correctly declared and reported as unused).
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
